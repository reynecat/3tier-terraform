name: PetClinic Multi-Cloud DR - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOCKER_USERNAME: cloud039
  WEB_IMAGE_NAME: petclinic-web
  WAS_IMAGE_NAME: petclinic-was
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: blue-eks
  AZURE_REGION: koreacentral
  AKS_CLUSTER_NAME: aks-dr-blue

jobs:
  # Job 1: Build and Test
  build:
    name: Build & Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          cd spring-petclinic
          ./mvnw clean package -DskipTests

      - name: Run Tests
        run: |
          cd spring-petclinic
          ./mvnw test
        continue-on-error: true

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: petclinic-jar
          path: spring-petclinic/target/*.jar
          retention-days: 1

  # Job 2: Code Quality Analysis
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: SonarQube Scan (Optional)
        run: |
          echo "SonarQube scan would run here if configured"
          # ./mvnw sonar:sonar -Dsonar.projectKey=petclinic
        continue-on-error: true

  # Job 3: Security Scanning
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './spring-petclinic'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Job 4: Build and Push Docker Images
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: petclinic-jar
          path: spring-petclinic/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata
        id: meta
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          DATE_TAG=$(date +%Y%m%d)

          if [ "$BRANCH_NAME" = "main" ]; then
            echo "tags=latest,${DATE_TAG}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "tags=${BRANCH_NAME}-${DATE_TAG}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push WAS Image
        uses: docker/build-push-action@v5
        with:
          context: ./spring-petclinic
          file: ./spring-petclinic/Dockerfile.was
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.WAS_IMAGE_NAME }}:${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./spring-petclinic
          file: ./spring-petclinic/Dockerfile.web
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.WEB_IMAGE_NAME }}:${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_USERNAME }}/${{ env.WAS_IMAGE_NAME }}:latest'
          format: 'table'
        continue-on-error: true

  # Job 5: Update GitOps Repository
  update-gitops:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Image Tags
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          DATE_TAG=$(date +%Y%m%d)
          NEW_TAG="${DATE_TAG}-${SHORT_SHA}"

          # Update WAS deployment
          sed -i "s|image: cloud039/petclinic-was:.*|image: cloud039/petclinic-was:${NEW_TAG}|g" \
            codes/aws/2.\ service/k8s-manifests/was/deployment.yaml

          # Update Web deployment
          sed -i "s|image: cloud039/petclinic-web:.*|image: cloud039/petclinic-web:${NEW_TAG}|g" \
            codes/aws/2.\ service/k8s-manifests/web/deployment.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add codes/aws/2.\ service/k8s-manifests/
          git commit -m "chore: update image tags to $(date +%Y%m%d)-$(echo $GITHUB_SHA | cut -c1-7)" || exit 0
          git push

  # Job 6: Deploy to AWS EKS
  deploy-aws-eks:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: update-gitops
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f codes/aws/2.\ service/k8s-manifests/namespaces.yaml
          kubectl apply -f codes/aws/2.\ service/k8s-manifests/web/
          kubectl apply -f codes/aws/2.\ service/k8s-manifests/was/
          kubectl apply -f codes/aws/2.\ service/k8s-manifests/ingress/

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/web-nginx -n web --timeout=5m
          kubectl rollout status deployment/was-spring -n was --timeout=5m

      - name: Verify Deployment
        run: |
          echo "=== Web Pods ==="
          kubectl get pods -n web
          echo "=== WAS Pods ==="
          kubectl get pods -n was
          echo "=== Ingress ==="
          kubectl get ingress -A

  # Job 7: Deploy to Azure AKS (DR Site)
  deploy-azure-aks:
    name: Deploy to Azure AKS (DR)
    runs-on: ubuntu-latest
    needs: deploy-aws-eks
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials --resource-group rg-dr-blue --name ${{ env.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl apply -f codes/azure/2-emergency/k8s-manifests/namespaces.yaml
          kubectl apply -f codes/azure/2-emergency/k8s-manifests/web/
          kubectl apply -f codes/azure/2-emergency/k8s-manifests/was/
          kubectl apply -f codes/azure/2-emergency/k8s-manifests/ingress.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods -A
          kubectl get ingress -A

  # Job 8: Health Check & Smoke Tests
  smoke-test:
    name: Health Check & Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-aws-eks
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Get ALB URL
        id: alb
        run: |
          ALB_URL=$(kubectl get ingress web-ingress -n web -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "url=http://${ALB_URL}" >> $GITHUB_OUTPUT

      - name: Health Check
        run: |
          sleep 30
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.alb.outputs.url }}/health)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed with code: $HTTP_CODE"
            exit 1
          fi
          echo "Health check passed!"

      - name: Application Smoke Test
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.alb.outputs.url }}/)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Smoke test failed with code: $HTTP_CODE"
            exit 1
          fi

          # Check for v2 message
          if curl -s ${{ steps.alb.outputs.url }}/ | grep -q "Multi-Cloud DR Project"; then
            echo "v2 deployment verified!"
          else
            echo "Warning: v2 message not found"
          fi

  # Job 9: Notify Deployment Status
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-aws-eks, smoke-test]
    if: always()

    steps:
      - name: Slack Notification (Success)
        if: success()
        run: |
          echo "Deployment successful! Slack notification would be sent here."
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"✅ PetClinic deployed successfully to AWS EKS!"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack Notification (Failure)
        if: failure()
        run: |
          echo "Deployment failed! Slack notification would be sent here."
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"❌ PetClinic deployment failed!"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

  # Job 10: Rollback (Manual Trigger)
  rollback:
    name: Rollback to Previous Version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Rollback Deployments
        run: |
          kubectl rollout undo deployment/web-nginx -n web
          kubectl rollout undo deployment/was-spring -n was

      - name: Wait for Rollback
        run: |
          kubectl rollout status deployment/web-nginx -n web --timeout=5m
          kubectl rollout status deployment/was-spring -n was --timeout=5m

      - name: Verify Rollback
        run: |
          kubectl get pods -A
